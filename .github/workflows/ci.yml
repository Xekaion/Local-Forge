name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test
        run: npm test

  engine:
    name: Engine / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCALFORGE_BACKEND: mock
      LOCALFORGE_RUNTIME_ROOT: ${{ runner.temp }}/localforge-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt

      - name: Install engine and test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r engine/requirements.txt \
            -r engine/requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q -f
          -x "(\.venv|runtime|__pycache__)"
          engine

      - name: Lint engine sources
        run: python -m ruff check engine

      - name: Check engine formatting
        run: python -m ruff format --check engine

      - name: Audit engine dependencies
        run: python -m pip_audit -r engine/requirements.txt

      - name: Run engine tests
        run: python -m pytest -q engine/tests
